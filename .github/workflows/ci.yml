name: OTD basic CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check

  smoke-public-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify published OTD demo is publicly accessible
        shell: bash
        run: |
          set -euo pipefail
          base="https://otd-fashion-demo.vercel.app"
          printf 'Checking homepage: %s\\n' "$base"
          curl --fail --location --silent --show-error --max-time 25 "$base/" -o /tmp/otd-home.html
          grep -qi 'OUTFIT OF THE DAY' /tmp/otd-home.html
          printf 'Homepage works and contains OTD branding\\n'
          curl --fail --location --silent --show-error --max-time 25 "$base/app.js" -o /tmp/otd-app.js
          grep -q 'function discover' /tmp/otd-app.js
          printf 'Frontend JavaScript asset is accessible\\n'
          curl --fail --location --silent --show-error --max-time 25 "$base/api/health" -o /tmp/otd-health.json
          grep -q '"ok":true' /tmp/otd-health.json
          printf 'Health API responds\\n'
          curl --fail --location --silent --show-error --max-time 25 "$base/manifest.webmanifest" -o /tmp/otd-manifest.json
          grep -q '"short_name": "OTD"' /tmp/otd-manifest.json
          printf 'Installable PWA manifest is accessible\n'
          curl --fail --location --silent --show-error --max-time 25 "$base/api/catalog" -o /tmp/otd-catalog.json
          grep -q '"demo":true' /tmp/otd-catalog.json
          grep -q '"seedInventory":' /tmp/otd-catalog.json
          printf 'Fictional catalog API is responding\n'
          curl --fail --location --silent --show-error --max-time 25 "$base/api/recommend" -H 'Content-Type: application/json' -d '{"budget":7000,"occasion":"College","style":"Casual","size":"M","shoeSize":"40"}' -o /tmp/otd-recommend.json
          grep -q '"method":"transparent-rules-not-trained-ML"' /tmp/otd-recommend.json
          grep -q '"looks":' /tmp/otd-recommend.json
          printf 'Rule-based recommendations API is responding\n'
          curl --fail --location --silent --show-error --max-time 25 "$base/photo-preview.js" -o /tmp/otd-photo-preview.js
          grep -q "export function photoPage" /tmp/otd-photo-preview.js
          grep -q "in this open browser tab" /tmp/otd-photo-preview.js
          curl --fail --location --silent --show-error --max-time 25 "$base/photo-engine.js" -o /tmp/otd-photo-engine.js
          grep -q "export function validatePhotoFile" /tmp/otd-photo-engine.js
          curl --fail --location --silent --show-error --max-time 25 "$base/avatar-core.js" -o /tmp/otd-avatar-core.js
          grep -q "export function avatarSvg" /tmp/otd-avatar-core.js
          printf 'Real-person photo styling and fallback avatar are accessible\n'
          curl --fail --location --silent --show-error --max-time 25 "$base/avatar3d-core.js" -o /tmp/otd-avatar3d-core.js
          grep -q "export function normalize3DAvatar" /tmp/otd-avatar3d-core.js
          curl --fail --location --silent --show-error --max-time 25 "$base/avatar3d-ui.js" -o /tmp/otd-avatar3d-ui.js
          grep -q "export function avatar3DPage" /tmp/otd-avatar3d-ui.js
          grep -q "otd-3d-stage" /tmp/otd-avatar3d-ui.js
          curl --fail --location --silent --show-error --max-time 25 "$base/avatar3d-renderer.js" -o /tmp/otd-avatar3d-renderer.js
          grep -q "export function mountAvatar3D" /tmp/otd-avatar3d-renderer.js
          curl --fail --location --silent --show-error --max-time 25 "$base/" -o /tmp/otd-avatar3d-home.html
          grep -q 'data-page="avatar3d"' /tmp/otd-avatar3d-home.html
          printf 'Live 3D avatar resources and dedicated navigation are available\n'
